# 小夜 HermesAgent — 游戏系统配置
# ---------------------------------------------------------------
# 数据库与行为参数。修改后重启代理生效。
# ---------------------------------------------------------------

database:
  # 数据库后端: sqlite / mysql / postgresql
  backend: sqlite
  # SQLite 数据库文件位置 — 相对 HERMES_HOME (Windows: %LOCALAPPDATA%/hermes)
  path: data/games.db

games:
  happyfarm:
    # 初始玩家金币
    initial_coins: 500
    # 初始农场等级
    initial_level: 1
    # 偷菜被发现时的金币损失
    steal_penalty: 20
    # 作物成熟后的金币倍率（卖出价格 / 种子价格）
    crop_price_multiplier: 2.0
    # 施肥加速比例 (0.5 = 施肥后时间缩短 50%)
    fertilizer_acceleration: 0.5

  fishing:
    # 初始金币
    initial_coins: 200
    # 初始鱼竿（竹竿 / 碳素竿 / 钛合金竿）
    initial_rod: bamboo
    # 初始鱼饵数量
    initial_bait_count: 10
    # 烹饪后的食物价值倍数
    cook_value_multiplier: 1.5
    # 高级鱼种出现概率调整
    rare_fish_bonus: 1.0
    epic_fish_bonus: 1.0
    legendary_fish_bonus: 1.0

# ---------------------------------------------------------------
# 小夜人格配置（可选 — 用于控制对话语气）
# 若在 %LOCALAPPDATA%/hermes/SOUL.md 定义了人设，此处为补充。
# ---------------------------------------------------------------
persona:
  name: 小夜
  style: healing
  include_games_prompt: true
